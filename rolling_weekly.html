<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rolling Weekly</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Courier+Prime:wght@400;700&display=swap');

  :root {
    --ink: #1a1a18;
    --paper: #f5f0e8;
    --paper-dark: #ede7d5;
    --rule: #c8bfa8;
    --rule-light: #ddd6c4;
    --accent: #8b3a2a;
    --accent-light: #c4593e;
    --dot-color: #2a5a3a;
    --x-color: #8b3a2a;
    --arrow-color: #3a4a8b;
    --dash-color: #9a8f7a;
    --shadow: rgba(26,26,24,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Courier Prime', monospace;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    background: var(--ink);
    color: var(--paper);
    padding: 14px 16px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px var(--shadow);
  }

  .header-left h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1;
  }

  .week-nav {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 3px;
  }

  .week-arrow {
    background: none;
    border: none;
    color: var(--rule);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    padding: 0 3px;
    transition: color 0.15s;
  }
  .week-arrow:hover { color: var(--paper); }

  .week-label {
    font-size: 0.65rem;
    color: var(--rule);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
  }

  .btn {
    font-family: 'Courier Prime', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 6px 10px;
    border: 1px solid currentColor;
    background: transparent;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .btn-ghost { color: var(--rule); }
  .btn-ghost:hover, .btn-ghost:active { color: var(--paper); background: rgba(255,255,255,0.1); }

  .btn-primary {
    color: var(--paper);
    background: var(--accent);
    border-color: var(--accent);
  }
  .btn-primary:hover, .btn-primary:active { background: var(--accent-light); }

  /* ── ADD TASK BAR ── */
  .add-bar {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    background: var(--paper-dark);
    border-bottom: 2px solid var(--rule);
  }

  .add-input {
    flex: 1;
    font-family: 'Courier Prime', monospace;
    font-size: 1rem;
    background: white;
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 8px 12px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }
  .add-input:focus { border-color: var(--accent); }
  .add-input::placeholder { color: var(--rule); }

  .btn-add {
    font-family: 'Courier Prime', monospace;
    font-size: 1.5rem;
    font-weight: 700;
    width: 42px;
    height: 42px;
    background: var(--accent);
    color: var(--paper);
    border: none;
    border-radius: 2px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
    line-height: 1;
  }
  .btn-add:hover, .btn-add:active { background: var(--accent-light); }

  /* ── GRID ── */
  .grid-wrapper {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 0 40px;
  }

  table {
    width: 100%;
    min-width: 420px;
    border-collapse: collapse;
  }

  thead th {
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dash-color);
    padding: 10px 0 8px;
    text-align: center;
    font-weight: 700;
    border-bottom: 2px solid var(--rule);
    background: var(--paper);
  }

  thead th.task-col {
    text-align: center;
    padding-right: 8px;
    padding-left: 16px;
    width: 99%;
  }

  .day-col { width: 38px; min-width: 38px; border-left: 1px solid var(--rule-light); }

  .date-sub {
    display: block;
    font-size: 0.55rem;
    font-weight: 400;
    color: var(--rule);
    margin-top: 2px;
    letter-spacing: 0.04em;
  }

  th.today-col { color: var(--accent); }
  th.today-col .date-sub { color: var(--accent); opacity: 0.6; }

  tbody tr {
    border-bottom: 1px solid var(--rule-light);
    transition: background 0.1s;
  }
  tbody tr:hover { background: rgba(255,255,255,0.5); }
  tbody tr.done-row { opacity: 0.55; }

  td.task-cell {
    padding: 10px 8px 10px 16px;
    font-size: 0.92rem;
    line-height: 1.3;
    cursor: pointer;
    word-break: break-word;
    text-align: right;
  }
  td.task-cell:hover { text-decoration: underline; text-decoration-color: var(--rule); }

  td.day-cell {
    text-align: center;
    vertical-align: middle;
    cursor: pointer;
    width: 38px;
    min-width: 38px;
    padding: 0;
    height: 44px;
    user-select: none;
    -webkit-user-select: none;
    border-left: 1px solid var(--rule-light);
  }

  td.day-cell:hover { background: rgba(255,255,255,0.6); }
  td.day-cell:active { background: rgba(255,255,255,0.9); }
  td.today-cell { background: rgba(139,58,42,0.04); }

  .cell-symbol {
    font-size: 0.95rem;
    line-height: 1;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
  }

  .sym-dot   { color: var(--ink);    font-size: 0.55rem; }
  .sym-slash { color: var(--ink);    font-size: 0.9rem;  }
  .sym-x     { color: var(--x-color); font-size: 0.9rem; font-weight: 700; }
  .sym-arrow { color: var(--ink);    font-size: 0.9rem;  }
  .sym-back  { color: var(--ink);    font-size: 0.9rem;  }
  .sym-dash  { color: var(--ink);    font-size: 0.9rem;  }

  td.delete-cell {
    width: 28px;
    min-width: 28px;
    text-align: center;
    vertical-align: middle;
    padding: 0 4px 0 0;
    border-left: 1px solid var(--rule-light);
  }

  .btn-delete-row {
    background: none;
    border: none;
    color: var(--rule);
    cursor: pointer;
    font-size: 0.75rem;
    padding: 4px;
    line-height: 1;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
  }
  tbody tr:hover .btn-delete-row { opacity: 1; }
  .btn-delete-row:hover { color: var(--accent); }

  .recurring-star {
    color: var(--accent);
    font-size: 0.7rem;
    vertical-align: middle;
    margin-right: 1px;
  }

  tbody tr.future-row { opacity: 0.45; font-style: italic; }

  .future-indicator {
    color: var(--rule);
    font-size: 0.7rem;
    font-style: normal;
    margin-right: 2px;
  }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--rule);
    font-size: 0.85rem;
    letter-spacing: 0.06em;
  }
  .empty-state p:first-child {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    margin-bottom: 8px;
    color: var(--dash-color);
  }

  /* ── SYMBOL PICKER ── */
  .popup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(26,26,24,0.35);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.1s ease;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .popup {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 4px;
    box-shadow: 0 8px 32px rgba(26,26,24,0.22);
    padding: 16px;
    min-width: 230px;
    animation: slideUp 0.15s ease;
  }

  .popup-title {
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dash-color);
    margin-bottom: 12px;
    text-align: center;
  }

  .popup-symbols {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }

  .sym-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 14px 4px 10px;
    background: white;
    border: 1.5px solid var(--rule-light);
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.12s;
    font-family: 'Courier Prime', monospace;
    -webkit-tap-highlight-color: transparent;
  }

  .sym-btn:hover, .sym-btn:active {
    border-color: var(--ink);
    background: var(--paper-dark);
  }

  .sym-btn.active {
    border-color: var(--ink);
    background: var(--ink);
  }

  .sym-btn .sym-icon {
    font-size: 1rem;
    line-height: 1;
    font-weight: 700;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sym-btn.is-dot   .sym-icon { font-size: 0.35rem; color: var(--dot-color); }
  .sym-btn.is-slash .sym-icon { color: var(--arrow-color); }
  .sym-btn.is-x     .sym-icon { color: var(--x-color); }
  .sym-btn.is-arrow .sym-icon { color: var(--arrow-color); }
  .sym-btn.is-back  .sym-icon { color: var(--arrow-color); }
  .sym-btn.is-dash  .sym-icon { color: var(--dash-color); }
  .sym-btn.active   .sym-icon { color: var(--paper) !important; }

  .sym-btn .sym-label {
    font-size: 0.48rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--dash-color);
    white-space: nowrap;
  }
  .sym-btn.active .sym-label { color: var(--rule); }

  .popup-cancel {
    width: 100%;
    font-family: 'Courier Prime', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 8px;
    background: none;
    border: 1px solid var(--rule-light);
    border-radius: 2px;
    color: var(--dash-color);
    cursor: pointer;
    transition: all 0.12s;
  }
  .popup-cancel:hover { border-color: var(--rule); color: var(--ink); }

  /* ── ARCHIVE VIEW ── */
  .view { display: none; }
  .view.active { display: block; }

  .archive-search {
    width: calc(100% - 32px);
    display: block;
    margin: 12px 16px;
    font-family: 'Courier Prime', monospace;
    font-size: 0.9rem;
    background: white;
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 7px 12px;
    color: var(--ink);
    outline: none;
    -webkit-appearance: none;
  }
  .archive-search:focus { border-color: var(--accent); }

  .archive-list { padding: 0 16px 40px; }

  .archive-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 0;
    border-bottom: 1px solid var(--rule-light);
    gap: 12px;
  }

  .archive-task { font-size: 0.9rem; line-height: 1.3; flex: 1; }

  .archive-date {
    font-size: 0.7rem;
    color: var(--dash-color);
    white-space: nowrap;
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }

  .archive-week-group {
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--rule);
    padding: 16px 0 4px;
  }

  .empty-archive {
    text-align: center;
    padding: 48px 24px;
    color: var(--rule);
    font-size: 0.85rem;
  }

  /* ── NEW WEEK MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(26,26,24,0.5);
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    animation: fadeIn 0.15s ease;
  }

  .modal {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 4px;
    box-shadow: 0 12px 48px rgba(26,26,24,0.28);
    padding: 24px;
    width: 100%;
    max-width: 420px;
    animation: slideUp 0.18s ease;
  }

  .modal h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    margin-bottom: 8px;
  }

  .modal p {
    font-size: 0.82rem;
    color: var(--dash-color);
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .modal-tasks {
    background: white;
    border: 1px solid var(--rule-light);
    border-radius: 2px;
    max-height: 220px;
    overflow-y: auto;
    margin-bottom: 16px;
  }

  .modal-task-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--rule-light);
    font-size: 0.85rem;
  }
  .modal-task-item:last-child { border-bottom: none; }

  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  /* ── EDIT POPUP ── */
  .edit-popup {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 4px;
    box-shadow: 0 8px 32px rgba(26,26,24,0.22);
    padding: 16px;
    min-width: 260px;
    max-width: 340px;
    width: 90vw;
    animation: slideUp 0.15s ease;
  }

  .edit-popup input {
    width: 100%;
    font-family: 'Courier Prime', monospace;
    font-size: 0.95rem;
    background: white;
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 8px 10px;
    color: var(--ink);
    outline: none;
    margin-bottom: 10px;
    -webkit-appearance: none;
  }
  .edit-popup input:focus { border-color: var(--accent); }

  .recurring-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--dash-color);
  }

  .recurring-toggle .star-badge {
    width: 28px;
    height: 28px;
    border: 1.5px solid var(--rule-light);
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    color: var(--rule);
    transition: all 0.15s;
    background: white;
  }

  .recurring-toggle.is-recurring .star-badge {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .recurring-toggle.is-recurring { color: var(--accent); }

  .edit-popup-actions { display: flex; gap: 8px; }
  .edit-popup-actions button { flex: 1; }
</style>
</head>
<body>
<!-- LOGIN SCREEN -->
<div id="login-screen" style="display:none;position:fixed;inset:0;background:var(--paper);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;">
  <div style="text-align:center">
    <h1 style="font-family:'Playfair Display',serif;font-size:2rem;color:var(--ink);margin-bottom:8px">Rolling Weekly</h1>
    <p style="font-size:0.8rem;color:var(--dash-color);letter-spacing:0.08em;text-transform:uppercase">sign in to sync across devices</p>
  </div>
  <button onclick="signInWithGoogle()" style="font-family:'Courier Prime',monospace;font-size:0.85rem;letter-spacing:0.06em;text-transform:uppercase;padding:12px 24px;background:var(--ink);color:var(--paper);border:none;border-radius:2px;cursor:pointer;display:flex;align-items:center;gap:10px">
    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    sign in with google
  </button>
</div>

<div id="app">

  <!-- MAIN VIEW -->
  <div id="view-main" class="view active">
    <header>
      <div class="header-left">
        <h1>Rolling Weekly</h1>
        <div class="week-nav">
          <button class="week-arrow" onclick="shiftWeek(-1)" title="previous week">‹</button>
          <div class="week-label" id="week-label">—</div>
          <button class="week-arrow" onclick="shiftWeek(1)" title="next week">›</button>
        </div>
        <div id="sync-indicator" style="font-size:0.55rem;color:var(--rule);letter-spacing:0.08em;margin-top:2px"></div>
      </div>
      <div class="header-actions">
        <button class="btn btn-ghost" onclick="showArchive()">Archive</button>
        <button class="btn btn-primary" onclick="showNewWeek()">New Week</button>
      </div>
    </header>

    <div class="add-bar">
      <input class="add-input" id="add-input" type="text" placeholder="add a task…" autocomplete="off" spellcheck="true">
      <button class="btn-add" onclick="addTask()">+</button>
    </div>

    <div class="grid-wrapper">
      <table id="task-table">
        <thead id="table-head"></thead>
        <tbody id="task-body"></tbody>
      </table>
    </div>
  </div>

  <!-- ARCHIVE VIEW -->
  <div id="view-archive" class="view">
    <header>
      <div class="header-left">
        <h1>Archive</h1>
        <div class="week-label">completed tasks</div>
      </div>
      <div class="header-actions">
        <button class="btn btn-ghost" onclick="showMain()">← back</button>
      </div>
    </header>
    <input class="archive-search" id="archive-search" type="search" placeholder="search archive…" oninput="renderArchive()">
    <div class="archive-list" id="archive-list"></div>
  </div>

</div>

<!-- SYMBOL PICKER -->
<div id="symbol-overlay" class="popup-overlay" style="display:none">
  <div class="popup">
    <div class="popup-title">mark as</div>
    <div class="popup-symbols">
      <button class="sym-btn is-dot"      onclick="pickSymbol('dot')">
        <span class="sym-icon">·</span>
        <span class="sym-label">planned</span>
      </button>
      <button class="sym-btn is-slash"    onclick="pickSymbol('slash')">
        <span class="sym-icon">\</span>
        <span class="sym-label">started</span>
      </button>
      <button class="sym-btn is-x"        onclick="pickSymbol('x')">
        <span class="sym-icon">×</span>
        <span class="sym-label">done</span>
      </button>
      <button class="sym-btn is-arrow"    onclick="pickSymbol('arrow')">
        <span class="sym-icon">›</span>
        <span class="sym-label">moved fwd</span>
      </button>
      <button class="sym-btn is-back"     onclick="pickSymbol('back')">
        <span class="sym-icon">‹</span>
        <span class="sym-label">pulled bk</span>
      </button>
      <button class="sym-btn is-dash"     onclick="pickSymbol('dash')">
        <span class="sym-icon">—</span>
        <span class="sym-label">won't do</span>
      </button>
    </div>
    <button class="popup-cancel" onclick="closeSymbolPicker()">cancel</button>
  </div>
</div>

<!-- EDIT TASK -->
<div id="edit-overlay" class="popup-overlay" style="display:none">
  <div class="edit-popup">
    <div class="popup-title">edit task</div>
    <input id="edit-input" type="text" autocomplete="off">
    <div class="recurring-toggle" id="recurring-toggle" onclick="toggleRecurring()">
      <div class="star-badge">✦</div>
      <span id="recurring-label">repeating task</span>
    </div>
    <div class="edit-popup-actions">
      <button class="btn btn-ghost" style="color:var(--ink);border-color:var(--rule)" onclick="closeEditPopup()">cancel</button>
      <button class="btn btn-ghost" style="color:var(--ink);border-color:var(--rule)" onclick="duplicateTask()">duplicate</button>
      <button class="btn btn-primary" onclick="saveEdit()">save</button>
    </div>
  </div>
</div>

<!-- NEW WEEK MODAL -->
<div id="newweek-overlay" class="modal-overlay" style="display:none">
  <div class="modal">
    <h2>Start new week?</h2>
    <p id="newweek-desc">Completed tasks will move to archive. The following will carry forward:</p>
    <div class="modal-tasks" id="newweek-task-list"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" style="color:var(--ink);border-color:var(--rule)" onclick="closeNewWeek()">cancel</button>
      <button class="btn btn-primary" onclick="confirmNewWeek()">start new week</button>
    </div>
  </div>
</div>

<script>
const DAYS = ['S','M','T','W','T','F','S'];
const RESOLVED = ['x', 'dash', 'back'];
const SUPABASE_URL = 'https://nxlnewbmvmuuypzortqx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im54bG5ld2Jtdm11dXlwem9ydHF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NTUzNzcsImV4cCI6MjA5NDUzMTM3N30.GHsY-tWpKuBE4ckZi6RHvo1C-41sIY4iv82GMRZ0c-s';
const ROW_ID = 'main';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;

async function signInWithGoogle() {
  await supabase.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.href }
  });
}

async function signOut() {
  await supabase.auth.signOut();
  window.location.reload();
}

function showLoginScreen() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

// ── STATE ─────────────────────────────────────────────────────────────────────
function emptyState() {
  return { weekStart: getThisSunday(), tasks: [], archive: [] };
}

function localLoad() {
  try {
    const raw = localStorage.getItem('rollingList_v2');
    if (raw) return JSON.parse(raw);
    const old = localStorage.getItem('rollingList_v1');
    if (old) {
      const v1 = JSON.parse(old);
      v1.tasks = v1.tasks.map(t => ({
        ...t,
        schedule: { [v1.weekStart]: t.days || ['','','','','','',''] },
        completedDates: t.completedDates || {}
      }));
      return v1;
    }
  } catch(e) {}
  return emptyState();
}

function localSave(s) {
  localStorage.setItem('rollingList_v2', JSON.stringify(s));
}

async function remoteLoad() {
  if (!currentUser) return null;
  try {
    const { data, error } = await supabase
      .from('rolling_weekly')
      .select('data')
      .eq('id', currentUser.id)
      .single();
    if (error || !data) return null;
    return data.data;
  } catch(e) { return null; }
}

async function remoteSave(s) {
  if (!currentUser) return;
  try {
    await supabase.from('rolling_weekly').upsert({
      id: currentUser.id,
      data: s,
      updated_at: new Date().toISOString()
    });
  } catch(e) {}
}

function saveState() {
  localSave(state);
  remoteSave(state);
}

let state = localLoad();
let pickerCtx = null;
let editCtx   = null;

function setLoading(on) {
  const el = document.getElementById('sync-indicator');
  if (el) el.textContent = on ? 'syncing…' : '';
}

// ── DATE HELPERS ──────────────────────────────────────────────────────────────
function getThisSunday() {
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() - d.getDay());
  return d.toISOString().slice(0,10);
}

function parseDate(str) {
  const [y,m,d] = str.split('-').map(Number);
  return new Date(y, m-1, d);
}

function formatShort(str) {
  return parseDate(str).toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

function getWeekDates(ws) {
  return Array.from({length:7}, (_,i) => {
    const d = parseDate(ws);
    d.setDate(d.getDate() + i);
    return d.toISOString().slice(0,10);
  });
}

function getTodayCol() {
  const ws = parseDate(state.weekStart);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((today - ws) / 86400000);
  return (diff >= 0 && diff < 7) ? diff : -1;
}

function weekLabel(ws) {
  const dates = getWeekDates(ws);
  return formatShort(dates[0]) + ' – ' + formatShort(dates[6]);
}

// Get days array for a task in the current viewing week
function getTaskDays(task, ws) {
  if (!task.schedule) return ['','','','','','',''];
  return task.schedule[ws] || ['','','','','','',''];
}

// Check if task has any dots in any week other than the given one
function hasDotsInOtherWeeks(task, ws) {
  if (!task.schedule) return false;
  for (const [week, days] of Object.entries(task.schedule)) {
    if (week === ws) continue;
    if (days.some(Boolean)) return true;
  }
  return false;
}

// Should this task show in the current week view?
function taskVisibleInWeek(task, ws) {
  const days = getTaskDays(task, ws);
  const hasDaysThisWeek = days.some(Boolean);
  if (hasDaysThisWeek) return true;
  // show if no dots anywhere at all (unscheduled)
  if (!task.schedule) return true;
  const hasAnyDots = Object.values(task.schedule).some(d => d.some(Boolean));
  return !hasAnyDots;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  document.getElementById('week-label').textContent = weekLabel(state.weekStart);
  renderHead();
  renderBody();
}

function renderHead() {
  const dates = getWeekDates(state.weekStart);
  const ti = getTodayCol();
  let h = '<tr><th class="task-col">task</th>';
  for (let i=0; i<7; i++) {
    const tc = i===ti ? ' today-col' : '';
    const day = formatShort(dates[i]).replace(/\w+ /,'');
    h += `<th class="day-col${tc}">${DAYS[i]}<span class="date-sub">${day}</span></th>`;
  }
  h += '<th style="width:28px;min-width:28px;border-left:1px solid var(--rule-light)"></th></tr>';
  document.getElementById('table-head').innerHTML = h;
}

function renderBody() {
  const ti = getTodayCol();
  const ws = state.weekStart;
  const tbody = document.getElementById('task-body');

  const visible = state.tasks.filter(t => taskVisibleInWeek(t, ws));

  if (!visible.length) {
    tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state">
      <p>Nothing here yet.</p>
      <p>Add a task above to begin your week.</p>
    </div></td></tr>`;
    return;
  }

  let h = '';
  for (const t of visible) {
    const days = getTaskDays(t, ws);
    const done = days.includes('x');
    // show dim indicator if task has dots in other weeks but not this one
    const futureOnly = !days.some(Boolean) && hasDotsInOtherWeeks(t, ws);
    h += `<tr${done ? ' class="done-row"' : futureOnly ? ' class="future-row"' : ''}>`;
    h += `<td class="task-cell" onclick="openEdit('${t.id}')">`;
    if (t.recurring) h += '<span class="recurring-star">✦</span> ';
    if (futureOnly)  h += '<span class="future-indicator">→</span> ';
    h += `${esc(t.text)}</td>`;
    for (let i=0; i<7; i++) {
      const sym = days[i] || '';
      const tc = i===ti ? ' today-cell' : '';
      h += `<td class="day-cell${tc}" onclick="openPicker('${t.id}',${i})">
        <div class="cell-symbol">${renderSym(sym)}</div></td>`;
    }
    h += `<td class="delete-cell">
      <button class="btn-delete-row" onclick="deleteTask('${t.id}')">✕</button>
    </td></tr>`;
  }
  tbody.innerHTML = h;
}

function renderSym(s) {
  if (!s) return '';
  if (s==='dot')   return '<span class="sym-dot">·</span>';
  if (s==='slash') return '<span class="sym-slash">\\</span>';
  if (s==='x')     return '<span class="sym-x">×</span>';
  if (s==='arrow') return '<span class="sym-arrow">›</span>';
  if (s==='back')  return '<span class="sym-back">‹</span>';
  if (s==='dash')  return '<span class="sym-dash">—</span>';
  return '';
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── TASKS ─────────────────────────────────────────────────────────────────────
function addTask() {
  const inp = document.getElementById('add-input');
  const text = inp.value.trim();
  if (!text) return;
  state.tasks.push({
    id: 'task_' + Date.now() + '_' + Math.random().toString(36).slice(2,5),
    text,
    schedule: {},
    completedDates: {}
  });
  inp.value = '';
  saveState();
  renderBody();
}

document.getElementById('add-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTask();
});

function deleteTask(id) {
  state.tasks = state.tasks.filter(t => t.id !== id);
  saveState();
  renderBody();
}

// ── SYMBOL PICKER ─────────────────────────────────────────────────────────────
function openPicker(taskId, dayIdx) {
  pickerCtx = { taskId, dayIdx };
  const task = state.tasks.find(t => t.id === taskId);
  const days = getTaskDays(task, state.weekStart);
  const cur = days[dayIdx] || '';

  document.querySelectorAll('.sym-btn').forEach(b => b.classList.remove('active'));
  const map = { dot:'is-dot', slash:'is-slash', x:'is-x', arrow:'is-arrow', back:'is-back', dash:'is-dash' };
  if (cur && map[cur]) document.querySelector('.'+map[cur])?.classList.add('active');

  document.getElementById('symbol-overlay').style.display = 'flex';
}

function closeSymbolPicker() {
  document.getElementById('symbol-overlay').style.display = 'none';
  pickerCtx = null;
}

document.getElementById('symbol-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeSymbolPicker();
});

function pickSymbol(sym) {
  if (!pickerCtx) return;
  const { taskId, dayIdx } = pickerCtx;
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;
  if (!task.schedule) task.schedule = {};
  if (!task.schedule[state.weekStart]) task.schedule[state.weekStart] = ['','','','','','',''];
  if (!task.completedDates) task.completedDates = {};

  const days = task.schedule[state.weekStart];
  const cdKey = `${state.weekStart}_${dayIdx}`;

  if (days[dayIdx] === sym) {
    days[dayIdx] = '';
    if (RESOLVED.includes(sym)) delete task.completedDates[cdKey];
  } else {
    if (RESOLVED.includes(days[dayIdx])) delete task.completedDates[cdKey];
    days[dayIdx] = sym;
    if (RESOLVED.includes(sym)) {
      task.completedDates[cdKey] = getWeekDates(state.weekStart)[dayIdx];
    }
  }

  saveState();
  closeSymbolPicker();
  renderBody();
}

// ── EDIT TASK ─────────────────────────────────────────────────────────────────
function openEdit(id) {
  const task = state.tasks.find(t => t.id === id);
  if (!task) return;
  editCtx = id;
  document.getElementById('edit-input').value = task.text;
  const toggle = document.getElementById('recurring-toggle');
  task.recurring ? toggle.classList.add('is-recurring') : toggle.classList.remove('is-recurring');
  document.getElementById('edit-overlay').style.display = 'flex';
  setTimeout(() => document.getElementById('edit-input').focus(), 60);
}

function toggleRecurring() {
  document.getElementById('recurring-toggle').classList.toggle('is-recurring');
}

function duplicateTask() {
  const task = state.tasks.find(t => t.id === editCtx);
  if (!task) return;
  const val = document.getElementById('edit-input').value.trim();
  const isRecurring = document.getElementById('recurring-toggle').classList.contains('is-recurring');
  state.tasks.push({
    id: 'task_' + Date.now() + '_' + Math.random().toString(36).slice(2,5),
    text: val || task.text,
    schedule: {},
    completedDates: {},
    recurring: isRecurring
  });
  saveState();
  closeEditPopup();
  renderBody();
}

function closeEditPopup() {
  document.getElementById('edit-overlay').style.display = 'none';
  editCtx = null;
}

document.getElementById('edit-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeEditPopup();
});

document.getElementById('edit-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveEdit();
  if (e.key === 'Escape') closeEditPopup();
});

function saveEdit() {
  const task = state.tasks.find(t => t.id === editCtx);
  const val = document.getElementById('edit-input').value.trim();
  const isRecurring = document.getElementById('recurring-toggle').classList.contains('is-recurring');
  if (task && val) {
    task.text = val;
    task.recurring = isRecurring;
    saveState();
    renderBody();
  }
  closeEditPopup();
}

// ── NEW WEEK ──────────────────────────────────────────────────────────────────
function showNewWeek() {
  const ws = state.weekStart;
  const carrying = state.tasks.filter(t => {
    if (t.recurring) return true;
    const days = getTaskDays(t, ws);
    return !days.some(s => RESOLVED.includes(s));
  });
  const doneCount = state.tasks.filter(t => {
    if (t.recurring) return false;
    const days = getTaskDays(t, ws);
    return days.some(s => RESOLVED.includes(s));
  }).length;

  document.getElementById('newweek-desc').textContent =
    `${doneCount} task${doneCount!==1?'s':''} will move to archive. The following will carry forward:`;

  let h = '';
  if (!carrying.length) {
    h = '<div style="padding:14px 12px;color:var(--dash-color);font-size:0.82rem;text-align:center">Nothing to carry — all done!</div>';
  } else {
    for (const t of carrying) {
      const days = getTaskDays(t, ws);
      const lastSym = [...days].reverse().find(Boolean) || '';
      h += `<div class="modal-task-item">
        <span style="width:16px;text-align:center;flex-shrink:0">${renderSym(lastSym)||'·'}</span>
        <span>${esc(t.text)}</span>
      </div>`;
    }
  }
  document.getElementById('newweek-task-list').innerHTML = h;
  document.getElementById('newweek-overlay').style.display = 'flex';
}

function closeNewWeek() {
  document.getElementById('newweek-overlay').style.display = 'none';
}

function confirmNewWeek() {
  const ws = state.weekStart;
  const dates = getWeekDates(ws);

  // archive resolved non-recurring tasks (only looking at current week's marks)
  for (const t of state.tasks) {
    if (t.recurring) continue;
    const days = getTaskDays(t, ws);
    const resolvedIdxs = days.map((s,i) => RESOLVED.includes(s) ? i : -1).filter(i=>i>=0);
    if (!resolvedIdxs.length) continue;
    const lastIdx = resolvedIdxs[resolvedIdxs.length-1];
    const resolution = days[lastIdx];
    const cdKey = `${ws}_${lastIdx}`;
    const completedDate = t.completedDates?.[cdKey] || dates[lastIdx];
    const symLabel = resolution === 'x' ? '×' : resolution === 'dash' ? '—' : '‹';
    state.archive.unshift({
      text: t.text, completedDate, weekStart: ws,
      archivedAt: new Date().toISOString(), resolution, symLabel
    });
  }

  // remove resolved non-recurring tasks; keep recurring and unresolved
  // also clean up the current week's schedule entry from carried tasks
  state.tasks = state.tasks
    .filter(t => {
      if (t.recurring) return true;
      const days = getTaskDays(t, ws);
      return !days.some(s => RESOLVED.includes(s));
    })
    .map(t => {
      // remove current week's schedule so it doesn't linger
      if (t.schedule && t.schedule[ws]) delete t.schedule[ws];
      return t;
    });

  // advance to next Sunday
  const next = parseDate(ws);
  next.setDate(next.getDate() + 7);
  state.weekStart = next.toISOString().slice(0,10);

  saveState();
  closeNewWeek();
  render();
}

// ── WEEK NAVIGATION ───────────────────────────────────────────────────────────
function shiftWeek(dir) {
  const d = parseDate(state.weekStart);
  d.setDate(d.getDate() + (dir * 7));
  state.weekStart = d.toISOString().slice(0,10);
  saveState();
  render();
}

// ── ARCHIVE ───────────────────────────────────────────────────────────────────
function showArchive() {
  document.getElementById('view-main').classList.remove('active');
  document.getElementById('view-archive').classList.add('active');
  renderArchive();
}

function showMain() {
  document.getElementById('view-archive').classList.remove('active');
  document.getElementById('view-main').classList.add('active');
}

function renderArchive() {
  const q = document.getElementById('archive-search').value.toLowerCase();
  const items = state.archive.filter(a => !q || a.text.toLowerCase().includes(q));

  if (!items.length) {
    document.getElementById('archive-list').innerHTML =
      '<div class="empty-archive">No completed tasks yet.</div>';
    return;
  }

  const groups = {};
  for (const item of items) {
    const k = item.weekStart || 'earlier';
    (groups[k] = groups[k]||[]).push(item);
  }

  let h = '';
  for (const k of Object.keys(groups).sort((a,b)=>b.localeCompare(a))) {
    h += `<div class="archive-week-group">${k==='earlier'?'Earlier':'Week of '+weekLabel(k)}</div>`;
    for (const item of groups[k]) {
      h += `<div class="archive-item">
        <span class="archive-task">${esc(item.text)}</span>
        <span class="archive-date">${item.symLabel || '×'} ${item.completedDate ? formatShort(item.completedDate) : '—'}</span>
      </div>`;
    }
  }
  document.getElementById('archive-list').innerHTML = h;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
  const { data: { session } } = await supabase.auth.getSession();

  if (!session) {
    showLoginScreen();
    return;
  }

  currentUser = session.user;
  showApp();
  render();

  setLoading(true);
  const remote = await remoteLoad();
  setLoading(false);

  if (remote) {
    state = remote;
    localSave(state);
    render();
  } else {
    remoteSave(state);
  }
}

supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && session) {
    currentUser = session.user;
    showApp();
    init();
  } else if (event === 'SIGNED_OUT') {
    showLoginScreen();
  }
});

init();
</script>
</body>
</html>
